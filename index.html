<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пекарня — поставки и возвраты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f3;--ink:#1d2a30;--mute:#667379;--line:#dde1dc;--ok:#14524f;--ret:#c2561e;--surf:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Onest,system-ui,sans-serif}
main{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px}
.banner{background:#fff3e8;border:1px solid #f0cdb0;color:#7a3a12;padding:10px 14px;border-radius:6px;margin-bottom:16px;display:none}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:24px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--ink);min-width:150px}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:24px;border-top:2px solid var(--ink);padding-top:14px;margin-bottom:28px}
.kpi b{display:block;font-size:32px;line-height:1.1;font-weight:700}
.kpi span{color:var(--mute);font-size:13px}
.kpi.r b{color:var(--ret)}
h2{font-size:17px;margin:0 0 10px}
.chart{display:flex;align-items:end;gap:2px;height:150px;margin-bottom:6px;overflow-x:auto}
.bar{flex:1 0 8px;min-width:8px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar i{display:block;background:var(--ok)}
.bar u{display:block;background:var(--ret);text-decoration:none}
.legend{font-size:13px;color:var(--mute);margin-bottom:28px;display:flex;gap:16px}
.legend s{display:inline-block;width:10px;height:10px;margin-right:6px;text-decoration:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{font:inherit;background:none;border:0;padding:8px 14px;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ok);font-weight:500}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surf)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pct{display:inline-block;height:6px;background:var(--ret);border-radius:3px;vertical-align:middle;margin-left:8px}
.empty{padding:24px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>Поставки и возвраты</h1>
  <p class="sub" id="status">Загрузка данных…</p>
  <div class="banner" id="banner"></div>

  <div class="filters">
    <label>С даты<input type="date" id="from"></label>
    <label>По дату<input type="date" id="to"></label>
    <label>Магазин<select id="store"></select></label>
    <label>Агент<select id="agent"></select></label>
  </div>

  <div class="kpis" id="kpis"></div>

  <h2>По дням</h2>
  <div class="chart" id="chart" role="img" aria-label="Привезено и возвращено по дням"></div>
  <div class="legend"><span><s style="background:var(--ok)"></s>Привезено, за вычетом возвратов</span><span><s style="background:var(--ret)"></s>Возвращено</span></div>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="wrap" id="table"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ВСТАВЬТЕ данные вашего проекта Supabase (Project Settings → API).
// Используйте только публичный ключ anon — секретный service_role сюда вставлять нельзя.
const CONFIG = { url: "https://ahypidxqzyfoaygmmyqv.supabase.co/rest/v1/", anonKey: "" };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n).toLocaleString('ru-RU', {maximumFractionDigits: 1});
let rows = [], tab = 'store_name';
const TABS = [['store_name','Магазины'],['product_name','Продукция'],['agent_name','Агенты'],['detail','Детали']];

async function loadRows() {
  if (!CONFIG.url || !CONFIG.anonKey) return demoRows();
  const sb = supabase.createClient(CONFIG.url, CONFIG.anonKey);
  const out = [], step = 1000;
  for (let from = 0; ; from += step) {
    const { data, error } = await sb.from('deliveries')
      .select('delivery_date,store_name,product_name,agent_name,quantity,returned')
      .order('delivery_date', { ascending: false }).range(from, from + step - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < step) break;
  }
  return out;
}

function demoRows() {
  const stores = ['Магазин «Центр»','Продукты 24','Мини-маркет «Заря»','Ветка'];
  const prods = ['Сочен','Слойка','Кексы','Рогалик'];
  const agents = ['Агент 1','Агент 2','Агент 3'];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const out = [], today = new Date();
  for (let d = 0; d < 60; d++) {
    const dt = new Date(today - d * 864e5).toISOString().slice(0, 10);
    stores.forEach((s, i) => prods.forEach(p => {
      if (rnd() < .25) return;
      const q = Math.round(10 + rnd() * 40);
      out.push({ delivery_date: dt, store_name: s, product_name: p, agent_name: agents[(i + d) % 3], quantity: q, returned: Math.round(q * rnd() * .15) });
    }));
  }
  return out;
}

function fillSelect(el, label, values) {
  el.innerHTML = `<option value="">${label}</option>` + [...new Set(values)].sort().map(v => `<option>${esc(v)}</option>`).join('');
}

function filtered() {
  const f = $('from').value, t = $('to').value, s = $('store').value, a = $('agent').value;
  return rows.filter(r => (!f || r.delivery_date >= f) && (!t || r.delivery_date <= t) && (!s || r.store_name === s) && (!a || r.agent_name === a));
}

function group(list, key) {
  const m = new Map();
  list.forEach(r => { const g = m.get(r[key]) || { q: 0, r: 0 }; g.q += +r.quantity; g.r += +r.returned; m.set(r[key], g); });
  return [...m].sort((x, y) => y[1].q - x[1].q);
}

function render() {
  const list = filtered();
  const q = list.reduce((s, r) => s + +r.quantity, 0), ret = list.reduce((s, r) => s + +r.returned, 0);
  $('kpis').innerHTML =
    `<div class="kpi"><b>${fmt(q)}</b><span>привезено</span></div>` +
    `<div class="kpi r"><b>${fmt(ret)}</b><span>возвращено</span></div>` +
    `<div class="kpi"><b>${q ? fmt(ret / q * 100) : 0}%</b><span>доля возвратов</span></div>` +
    `<div class="kpi"><b>${new Set(list.map(r => r.store_name)).size}</b><span>магазинов в выборке</span></div>`;

  const days = group(list, 'delivery_date').sort((a, b) => a[0] < b[0] ? -1 : 1);
  const max = Math.max(1, ...days.map(d => d[1].q));
  $('chart').innerHTML = days.map(([d, v]) =>
    `<div class="bar" title="${esc(d)}: привезено ${fmt(v.q)}, возвращено ${fmt(v.r)}">` +
    `<i style="height:${(v.q - v.r) / max * 100}%"></i><u style="height:${v.r / max * 100}%"></u></div>`).join('');

  $('tabs').innerHTML = TABS.map(([k, n]) => `<button role="tab" aria-selected="${k === tab}" data-k="${k}">${n}</button>`).join('');
  if (!list.length) { $('table').innerHTML = '<div class="empty">За выбранный период данных нет. Измените даты или фильтры.</div>'; return; }

  if (tab === 'detail') {
    const head = ['Дата','Магазин','Продукт','Агент'];
    $('table').innerHTML = `<table><tr>${head.map(h => `<th>${h}</th>`).join('')}<th class="n">Привезли</th><th class="n">Вернули</th></tr>` +
      list.slice(0, 300).map(r => `<tr><td>${esc(r.delivery_date)}</td><td>${esc(r.store_name)}</td><td>${esc(r.product_name)}</td><td>${esc(r.agent_name)}</td><td class="n">${fmt(r.quantity)}</td><td class="n">${fmt(r.returned)}</td></tr>`).join('') +
      '</table>' + (list.length > 300 ? `<div class="empty">Показаны первые 300 из ${list.length} строк. Сузьте фильтры, чтобы увидеть остальные.</div>` : '');
  } else {
    const name = TABS.find(t => t[0] === tab)[1];
    $('table').innerHTML = `<table><tr><th>${name}</th><th class="n">Привезли</th><th class="n">Вернули</th><th class="n">Возвраты</th></tr>` +
      group(list, tab).map(([k, v]) => { const p = v.q ? v.r / v.q * 100 : 0;
        return `<tr><td>${esc(k)}</td><td class="n">${fmt(v.q)}</td><td class="n">${fmt(v.r)}</td><td class="n">${fmt(p)}%<span class="pct" style="width:${Math.min(p * 4, 80)}px"></span></td></tr>`; }).join('') + '</table>';
  }
}

async function init() {
  try {
    rows = await loadRows();
    const demo = !CONFIG.url || !CONFIG.anonKey;
    $('status').textContent = demo ? 'Демо-данные' : `Записей в базе: ${rows.length}`;
    if (demo) { $('banner').style.display = 'block'; $('banner').textContent = 'Показаны тестовые данные. Чтобы подключить базу, впишите url и anonKey проекта Supabase в блок CONFIG в начале скрипта.'; }
    fillSelect($('store'), 'Все магазины', rows.map(r => r.store_name));
    fillSelect($('agent'), 'Все агенты', rows.map(r => r.agent_name));
    const last = rows.reduce((m, r) => r.delivery_date > m ? r.delivery_date : m, '');
    if (last) { const d = new Date(last); d.setDate(d.getDate() - 29); $('from').value = d.toISOString().slice(0, 10); $('to').value = last; }
    render();
  } catch (e) {
    $('status').textContent = 'Не удалось загрузить данные';
    $('banner').style.display = 'block';
    $('banner').textContent = 'Ошибка: ' + (e.message || e) + '. Проверьте url и ключ, а также политику доступа (RLS) для таблицы deliveries.';
  }
}
['from','to','store','agent'].forEach(id => $(id).addEventListener('change', render));
$('tabs').addEventListener('click', e => { const k = e.target.dataset.k; if (k) { tab = k; render(); } });
init();
</script>
</body>
</html>
